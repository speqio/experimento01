name = "spamandala-astro-frontend"
main = "./dist/_worker.js/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

# Secrets (no van aquí, se configuran con `wrangler secret put`):
#   PUBLIC_WPGRAPHQL_URL
#   PUBLIC_SITE_URL
#   WEBPAY_ENVIRONMENT
#   WEBPAY_COMMERCE_CODE
#   WEBPAY_API_KEY
