name = "spamandala-astro-frontend"
main = "./dist/_worker.js/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

# Variables no secretas: viven aquí para que cada deploy no las borre. Cualquier
# variable agregada SOLO desde el panel de Cloudflare (sin declararla acá) se pierde
# en el próximo deploy, porque Wrangler sincroniza [vars] contra lo que dice este
# archivo — por eso WP_MEDIA_APP_USER (username, no sensible) se agrega acá.
[vars]
PUBLIC_SITE_URL = "https://laboratorio.space"
PUBLIC_WPGRAPHQL_URL = "https://cms.laboratorio.space/graphql"
WEBPAY_ENVIRONMENT = "INTEGRACION"
WEBPAY_COMMERCE_CODE = "597055555532"
WP_MEDIA_APP_USER = "giftcard-uploader"

# Secrets (NO van aquí — son sensibles; se cargan en el panel de Cloudflare marcados
# como "Secret"/encriptados, nunca como variable de texto plano, o con
# "wrangler secret put"). A diferencia de [vars], un secret real no se pierde en el
# deploy aunque no esté declarado acá:
#   WEBPAY_API_KEY
#   WC_REST_KEY
#   WC_REST_SECRET
#   WP_MEDIA_APP_PASSWORD
