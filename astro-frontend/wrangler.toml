name = "spamandala-astro-frontend"
main = "./dist/_worker.js/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

# Variables no secretas: viven aquí para que cada deploy no las borre.
[vars]
PUBLIC_SITE_URL = "https://laboratorio.space"
PUBLIC_WPGRAPHQL_URL = "https://cms.laboratorio.space/graphql"
WEBPAY_ENVIRONMENT = "INTEGRACION"
WEBPAY_COMMERCE_CODE = "597055555532"

# Secrets (NO van aquí; se cargan en el panel de Cloudflare o con "wrangler secret put"):
#   WEBPAY_API_KEY
#   WC_REST_KEY
#   WC_REST_SECRET
